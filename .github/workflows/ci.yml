name: CI - Integración

on:
  push:
    branches: [develop]
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Añadir línea de feature al README
        run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          echo "Añadida feature: $BRANCH" >> README.md

      - name: Commit y push del README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Actualiza README: añadida feature" || echo "Sin cambios que commitear"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        run: |
          if ("${{ secrets.DEV_TOKEN }}" -eq "$env:LOCAL_DEV_TOKEN") {
            Write-Host "Los tokens COINCIDEN"
            exit 0
          } else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }

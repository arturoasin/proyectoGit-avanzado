name: Prueba self-hosted

on: [push]

jobs:
  comparar-tokens:
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: bash
        run: |
          echo "Comparando DEV_TOKEN (secret) con LOCAL_DEV_TOKEN (variable local)..."
          if [ "${{ secrets.DEV_TOKEN }}" = "$LOCAL_DEV_TOKEN" ]; then
            echo "✅ Los tokens COINCIDEN"
            exit 0
          else
            echo "❌ Los tokens NO coinciden"
            exit 1
          fi

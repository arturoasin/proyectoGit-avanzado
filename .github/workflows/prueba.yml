name: Prueba self-hosted

on: [push]

jobs:
  comparar-tokens:
    runs-on: self-hosted

    steps:
      - name: Comparar DEV_TOKEN con LOCAL_DEV_TOKEN
        shell: powershell
        run: |
          Write-Host "Comparando DEV_TOKEN (secret) con LOCAL_DEV_TOKEN (variable local)..."
          if ("${{ secrets.DEV_TOKEN }}" -eq "$env:LOCAL_DEV_TOKEN") {
            Write-Host "Los tokens COINCIDEN"
            exit 0
          } else {
            Write-Host "Los tokens NO coinciden"
            exit 1
          }
